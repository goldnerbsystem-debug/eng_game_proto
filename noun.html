       <script type="module">
  // 1. Import Firebase App AND Firestore SDKs (using version 10/11 stable CDN paths)
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  // Your web app's Firebase configuration
  const firebaseConfig = {
    apiKey: "AIzaSyCSJsYWiGSwXske6pKup7j2N9zQ80maF5U",
    authDomain: "english-game-5e893.firebaseapp.com",
    projectId: "english-game-5e893",
    storageBucket: "english-game-5e893.firebasestorage.app",
    messagingSenderId: "861726724031",
    appId: "1:861726724031:web:505a82f29dfb2e88835b0a",
    measurementId: "G-14S8LPY5E4"
  };

  // 2. Initialize Firebase & Firestore
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app); // Initialize Firestore instance

  // 3. Global function for nouner.js to send session payload
  window.saveToFirestore = async function(sessionData) {
    try {
      // Passes 'db', the collection name, and the matching 'sessionData' argument
      const docRef = await addDoc(collection(db, "game_sessions"), sessionData);
      console.log("Document successfully written to Firestore with ID: ", docRef.id);
    } catch (e) {
      console.error("Error adding document to Firestore: ", e);
    }
  };
</script>
